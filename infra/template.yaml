AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Streetscope - static site on S3 and CloudFront, plus the checked-answer doctor (Claude Sonnet 5.5 on Amazon Bedrock) on Lambda.

Parameters:
  ClaudeModelId:
    Type: String
    Default: anthropic.claude-sonnet-5-5
    Description: Claude model id on Amazon Bedrock. Check the exact id and that the model is enabled in your region's Bedrock console.
  AskToken:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Shared secret the web page sends in x-ask-token so strangers cannot spend your Bedrock budget.

Resources:
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          Compress: true

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  AskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../build/lambda
      Handler: streetscope_agent.handler.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 1536
      Timeout: 60
      Environment:
        Variables:
          LLM_BACKEND: bedrock
          CLAUDE_MODEL: !Ref ClaudeModelId
          ASK_TOKEN: !Ref AskToken
          TWIN_DIR: /var/task/twins
          USE_LLM: "1"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Sub "https://${Distribution.DomainName}"
          AllowMethods: [GET, POST]
          AllowHeaders: [content-type, x-ask-token]

Outputs:
  SiteUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  AskUrl:
    Value: !GetAtt AskFunctionUrl.FunctionUrl
  WebBucketName:
    Value: !Ref WebBucket
